# Consumed by scripts/deploy.sh and scripts/check-status.sh.
SERVICE_NAME=elastic
CLUSTER=aks-1
NAMESPACE=elastic
OPERATOR_NAMESPACE=elastic-system

ECK_VERSION=3.5.0
STACK_VERSION=9.5.4

ES_NAME=elasticsearch
KIBANA_NAME=kibana

# <svc>.snail.internal — the Iguana dog-ops Issuing CA is name-constrained to snail.internal.
KIBANA_HOST=kibana.snail.internal
ES_INGEST_HOST=es-ingest.snail.internal

# Sizing — placeholders until ticket 0 settles them.
ES_NODE_COUNT=3
ES_DISK_SIZE=100Gi
ES_MEMORY=4Gi

# Required at deploy time, deliberately not defaulted:
#   STORAGE_CLASS   kubectl get storageclass
#   ACR_NAME        Gov ACR name (no .azurecr.us)
