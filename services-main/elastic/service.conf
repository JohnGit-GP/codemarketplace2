# Consumed by scripts/deploy.sh and scripts/check-status.sh.
SERVICE_NAME=elastic
CLUSTER=aks-1
NAMESPACE=elastic
OPERATOR_NAMESPACE=elastic-system

ECK_VERSION=3.5.0
STACK_VERSION=9.5.4

ES_NAME=elasticsearch
KIBANA_NAME=kibana

# Hostnames served by the aks-1 Istio internal gateway.
KIBANA_HOST=kibana.iguana.internal
ES_HOST=elasticsearch.iguana.internal

# Istio ingress gateway pod label (istio=<value>). Verified on aks-1.
ISTIO_INGRESS_SELECTOR=aks-istio-ingressgateway-internal

# Retention: 30 days for all data (confirmed). Enforced by manifests/es-api/ilm-beats-30d.json.
RETENTION_DAYS=30

# Sizing for 30 days x 3 clusters: ~100-300 GB data, x2 for the replica, + ~25% headroom.
# 256Gi is also a Premium SSD tier boundary (~1,100 IOPS). Expandable online — re-measure
# after ticket 7 (aks-1 Beats) and grow before the spokes land in ticket 8 if needed.
ES_NODE_COUNT=3
ES_DISK_SIZE=256Gi
ES_MEMORY=4Gi

# Premium SSD with Retain — created by manifests/storageclass.yaml. Overridable from env.
STORAGE_CLASS="${STORAGE_CLASS:-managed-csi-premium-retain}"

# Required at deploy time, deliberately not defaulted:
#   ACR_NAME        Gov ACR attached to aks-1 (no .azurecr.us)
