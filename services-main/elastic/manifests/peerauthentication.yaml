# Rendered by scripts/deploy.sh. Variables: NAMESPACE
#
# REQUIRED by the TLS model: Kibana's HTTP TLS is disabled, so Istio mTLS is the only thing
# encrypting 5601 inside the cluster. STRICT makes its sidecar refuse any plaintext connection.
#
# Elasticsearch is outside the mesh (no sidecar) and protects 9200/9300 with ECK's own TLS.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict
  namespace: ${NAMESPACE}
spec:
  mtls:
    mode: STRICT
