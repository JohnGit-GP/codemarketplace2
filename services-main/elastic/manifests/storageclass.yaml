# Premium SSD with Retain. Every built-in disk class on aks-1 uses reclaimPolicy: Delete,
# which destroys the Azure disk the moment its PVC is deleted. SLA/Cyber data should
# survive a mistaken PVC delete or scale-down, so ES gets its own class.
#
# Mirrors the built-in managed-csi-premium — parameters verified identical on aks-1
# ({"skuname":"Premium_LRS"}). Re-check if AKS ever changes the built-in class.
#
# Released disks are NOT cleaned up automatically — delete them in Azure deliberately.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-premium-retain
provisioner: disk.csi.azure.com
parameters:
  skuname: Premium_LRS
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
