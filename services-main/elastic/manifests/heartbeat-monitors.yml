# Uptime checks run by Heartbeat on aks-1 — the SLA target list.
# To add, change or remove a service, follow HEARTBEAT.md. In short: edit this file, then
#   ./scripts/deploy.sh heartbeat
# Heartbeat picks the change up within ~1–2 minutes without restarting.
#
# Rules for every entry:
#   id        unique, lowercase, never reused — it keys the history in Elasticsearch
#   tags      the cluster that hosts the service (aks-1, gl-aks, atl-aks) plus "sla"
#   up/down   any HTTP status below 400 is "up" (redirects are not followed, so a 302 to a
#             login page counts as up); list check.response.status to require specific codes
#   TLS       *.iguana.internal is verified against the Iguana CA in ca-bundle.pem

# ── aks-1 ──────────────────────────────────────────────────────────────────────────────
- id: kibana
  name: Kibana
  type: http
  schedule: '@every 60s'
  urls: ["https://kibana.iguana.internal/login"]
  tags: [aks-1, sla]
  ssl.certificate_authorities: [/usr/share/heartbeat/ca/ca-bundle.pem]

- id: elasticsearch
  name: Elasticsearch
  type: http
  schedule: '@every 60s'
  urls: ["https://elasticsearch.iguana.internal/"]
  check.response.status: [200, 401]     # 401 = up and asking for credentials
  tags: [aks-1, sla]
  ssl.certificate_authorities: [/usr/share/heartbeat/ca/ca-bundle.pem]

