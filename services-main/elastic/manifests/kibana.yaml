# Rendered by scripts/deploy.sh with envsubst. Variables: KIBANA_NAME NAMESPACE STACK_VERSION
# ES_NAME KIBANA_HOST SAML_ENABLED
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: ${KIBANA_NAME}
  namespace: ${NAMESPACE}
spec:
  version: ${STACK_VERSION}
  count: 1
  elasticsearchRef:
    name: ${ES_NAME}
  http:
    tls:
      selfSignedCertificate:
        # Plain HTTP on 5601 inside the pod; Istio mTLS STRICT covers the hop.
        disabled: true
  config:
    server.publicBaseUrl: https://${KIBANA_HOST}
    # Air-gapped: stop Kibana trying to reach Elastic's internet services.
    # Kibana will not start on an unknown key — re-check these against the 9.5 docs.
    telemetry.optIn: false
    telemetry.allowChangingOptInStatus: false
    newsfeed.enabled: false
    map.includeElasticMapsService: false
    # Stop Fleet polling the online Elastic Package Registry (epr.elastic.co) — without this
    # it logs an ERROR every minute. Bundled packages (e.g. synthetics) still install offline.
    # Verified present in Kibana v9.5.4 (fleet/server/config.ts).
    xpack.fleet.isAirGapped: true
    # TLS is terminated at the gateway, so Kibana can't infer that the browser is on HTTPS.
    xpack.security.secureCookies: true
    # Entra ID SSO (ticket 7). Basic stays on as break-glass for the elastic user.
    xpack.security.authc.providers:
      saml.saml1:
        enabled: ${SAML_ENABLED}
        order: 0
        realm: saml1
        description: "Log in with Entra ID"
      basic.basic1:
        order: 1
  podTemplate:
    metadata:
      annotations:
        traffic.sidecar.istio.io/includeInboundPorts: "*"
    spec:
      automountServiceAccountToken: true
