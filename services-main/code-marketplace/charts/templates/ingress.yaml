{{- if .Values.ingress.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "code-marketplace.fullname" . }}-gateway
  labels:
    {{- include "code-marketplace.labels" . | nindent 4 }}
spec:
  selector:
    istio: {{ .Values.istio.ingressSelector }}
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.host }}
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.ingress.host }}
      tls:
        httpsRedirect: true
{{- end }}
