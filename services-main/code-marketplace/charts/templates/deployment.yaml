apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "code-marketplace.fullname" . }}
  labels:
    {{- include "code-marketplace.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "code-marketplace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "code-marketplace.selectorLabels" . | nindent 8 }}
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: code-marketplace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - --address=0.0.0.0:{{ .Values.service.port }}
            - --artifactory={{ .Values.artifactory.url }}
            - --repo={{ .Values.artifactory.repo }}
            - --sign
          env:
            - name: ARTIFACTORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.artifactory.tokenSecretName }}
                  key: token
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
